# MuseumOS admin web — nginx config
#
# - Serves the Vite-built SPA from /usr/share/nginx/html
# - Reverse-proxies /api/  → api:3000  (NestJS, globalPrefix='api')
# - Reverse-proxies /img/  → api:3000  (static images, served by the API)
# - SPA fallback so client-side routes (react-router) work on hard refresh.
#
# Sits behind Coolify's Traefik — Traefik terminates TLS and forwards
# plain HTTP here, so we listen on :80 only.

server {
    listen 80;
    server_name _;

    # Admin can upload up to 10 images at once (API allows 10 × 25 MB each).
    client_max_body_size 100M;

    # Gzip the SPA assets (CSS/JS); images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---- API proxy ----
    # `^~` makes this prefix match win over the regex location below — without
    # it, requests like /img/foo.jpg get caught by the static-asset regex and
    # 404'd from the SPA root instead of being proxied to the API.
    location ^~ /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- Static images proxy ----
    # The API mounts /app/img (bind-mount from the host). It already sets
    # Cache-Control headers; nginx just forwards.
    location ^~ /img/ {
        proxy_pass         http://api:3000/img/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Big-ish images can be slow over a Pi/SD link — bump timeouts.
        proxy_read_timeout 120s;
    }

    # ---- SPA: hashed bundles are immutable, the entry HTML is not ----
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|webp|gif|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
