# MuseumOS capture PWA — nginx config
#
# - Serves the Vite + Workbox build from /usr/share/nginx/html
# - Reverse-proxies /api/  → api:3000  (same-origin → no CORS preflight)
# - Reverse-proxies /img/  → api:3000
# - Service-worker (sw.js, workbox-*.js, manifest.webmanifest) MUST NOT be
#   aggressively cached, otherwise the autoUpdate registration never sees
#   new versions.

server {
    listen 80;
    server_name _;

    # Mobile capture sends up to 10 photos at once; the API accepts 10 files
    # × 25 MB each, so give nginx headroom for a full batch (10 × ~10 MB).
    # 25M was too low — 6 phone photos already exceed it and got a 413.
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ^~ wins over the regex location below — without it, requests for
    # /img/foo.jpg get caught by the static-asset regex and 404 from the
    # SPA root instead of being proxied to the API.
    location ^~ /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location ^~ /img/ {
        proxy_pass         http://api:3000/img/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Workbox SW + manifest: must always revalidate, otherwise users get
    # stuck on an old shell.
    location = /sw.js                  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js          { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~ ^/workbox-[\w]+\.js$    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest   { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed assets (Vite emits /assets/foo-<hash>.js) are immutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|webp|gif|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
